site_name: mcp-proton
site_description: Policy-controlled MCP access to Proton Mail through Proton Mail Bridge
site_url: https://w0h1v.github.io/mcp-proton/
repo_url: https://github.com/w0h1v/mcp-proton
repo_name: w0h1v/mcp-proton
edit_uri: edit/main/docs/
copyright: Apache-2.0 · Independent project, not affiliated with or endorsed by Proton AG.

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

hooks:
  - mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Using it:
      - Deployment and trust boundaries: deployment.md
      - Storage and retention: storage.md
      - Bridge compatibility: compatibility.md
  - Project:
      - Roadmap: roadmap.md
      - Design: design.md
