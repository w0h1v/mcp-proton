# Categories for GitHub's auto-generated release notes (by pull request label).
changelog:
  exclude:
    labels: ["skip-changelog", "dependencies"]
  categories:
    - title: Security
      labels: ["security"]
    - title: Breaking changes (tool schemas, presets, storage)
      labels: ["breaking"]
    - title: New capabilities
      labels: ["feature", "capability"]
    - title: Bridge compatibility
      labels: ["compatibility", "bridge-evidence"]
    - title: Fixes
      labels: ["bug"]
    - title: Documentation
      labels: ["documentation"]
    - title: Other changes
      labels: ["*"]
