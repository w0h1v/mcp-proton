name: Bridge compatibility report
description: Report results of testing an mcp-proton operation against Proton Mail Bridge
labels: ["compatibility", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Compatibility reports record what happened against a real Bridge. Use a dedicated test account. Do not use a personal mailbox. Do not paste message contents, addresses, credentials or tokens. Fake-server results are not compatibility evidence and should not be reported here as such.

  - type: input
    id: operation
    attributes:
      label: Operation
      description: The exact `operation` text from `docs/compatibility.md`, for example "list hierarchy, special folders, counts".
    validations:
      required: true

  - type: input
    id: bridge-version
    attributes:
      label: Proton Mail Bridge version
      description: From Bridge's About screen.
    validations:
      required: true

  - type: input
    id: test-date
    attributes:
      label: Test date
      description: YYYY-MM-DD
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Passed
        - Passed with known limits
        - Failed
        - Partially passed
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Address mode (combined or split), storage mode, relevant Bridge settings, and the mcp-proton version.
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What the operation did on Bridge and in Proton webmail. Describe counts and states, not message contents.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Output of `mcp-proton diagnostics --json`, without `--include-mailboxes`.
      render: json
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This was tested with a dedicated test account, and no message contents, addresses, credentials or tokens are included.
          required: true
